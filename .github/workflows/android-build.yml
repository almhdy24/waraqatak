name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install NDK 29
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waraqatak-android-split-apks
          path: release/
          if-no-files-found: error
          retention-days: 14
