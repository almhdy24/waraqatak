name: Build Release APK (arm64)

# Small release APK for a single device ABI (arm64-v8a), e.g. Samsung Galaxy A16.
# Builds split-per-abi and uploads only the arm64-v8a APK.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-arm64-apk:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install NDK 29
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"

      - name: Install dependencies
        run: flutter pub get

      # Use the release keystore only when the secrets actually unlock it.
      # Otherwise build.gradle.kts falls back to debug signing so the build
      # still produces an installable release APK.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=android/app/upload-keystore.jks
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore configured; APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          if keytool -certreq -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" \
               -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -file /dev/null >/dev/null 2>&1; then
            echo "Release keystore verified."
            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore secrets do not unlock the keystore; APK will be debug-signed."
            rm -f "$KS"
          fi

      - name: Build release APK (arm64-v8a)
        env:
          # Test APK: allow the debug-key fallback above (Play uploads use
          # release.yml, which stays strict).
          ALLOW_DEBUG_SIGNING: 'false'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Publish arm64 release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="preview-arm64"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Waraqatak arm64-v8a Preview" --notes "Latest automated arm64-v8a APK build." --prerelease
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --clobber
          gh release edit "$TAG" --notes "Built from commit ${GITHUB_SHA:0:7} on $(date -u '+%Y-%m-%d %H:%M UTC')"
