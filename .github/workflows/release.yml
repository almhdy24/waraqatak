name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.1)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install NDK 29
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"

      - name: Install dependencies
        run: flutter pub get

      - name: Play compliance guard
        run: bash tool/check_play_compliance.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS=android/app/upload-keystore.jks
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release keystore secret KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          if ! keytool -certreq -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" \
               -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -file /dev/null >/dev/null 2>&1; then
            echo "::error::Keystore secrets do not unlock the keystore."
            exit 1
          fi
          echo "Release keystore verified."

      - name: Build release APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building universal release APK..."
          flutter build apk --release
          echo "Building arm64-v8a release APK..."
          flutter build apk --release --split-per-abi --target-platform android-arm64
          echo "Building release App Bundle..."
          flutter build appbundle --release

      - name: Prepare release assets
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${RAW_TAG#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Waraqatak-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Waraqatak-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/Waraqatak-${TAG}.aab"
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt "dist/mapping-${TAG}.txt"
          fi
          ls -la dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG }}"
          TITLE="Waraqatak $TAG"
          VERSION_NUM="${TAG#v}"
          NOTES_FILE=""
          if [ -f "docs/release-notes-${VERSION_NUM}.md" ]; then
            NOTES_FILE="docs/release-notes-${VERSION_NUM}.md"
          elif [ -f "CHANGELOG.md" ]; then
            NOTES_FILE="CHANGELOG.md"
          fi
          PRERELEASE_FLAG=""
          case "$TAG" in
            *alpha*|*beta*|*rc*|*preview*)
              PRERELEASE_FLAG="--prerelease"
              ;;
          esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$NOTES_FILE" ]; then
              gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
            else
              gh release create "$TAG" --title "$TITLE" --generate-notes $PRERELEASE_FLAG
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
