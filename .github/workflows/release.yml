name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install NDK 29
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865"

      - name: Install dependencies
        run: flutter pub get

      - name: Play compliance guard
        run: bash tool/check_play_compliance.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify AAB exists
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "AAB not found at $AAB"; exit 1; }
          echo "AAB size: $(du -sh $AAB | cut -f1)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: waraqatak-${{ github.ref_name }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Upload this to Play Console (App bundle explorer → Downloads →
      # ReTrace mapping file) so crash reports are de-obfuscated.
      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: waraqatak-${{ github.ref_name }}-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" build/app/outputs/bundle/release/app-release.aab --clobber || true
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            gh release upload "${{ github.ref_name }}" build/app/outputs/mapping/release/mapping.txt --clobber || true
          fi
