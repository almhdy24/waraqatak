name: warqatek

description: Waraqatak - invoices and business documents.

publish_to: 'none'

version: 1.1.5-beta+18

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: '>=2.3.0 <2.4.0'
  path: ^1.8.3

  # File & Storage
  path_provider: ^2.1.5
  file_picker: ^12.1.2
  shared_preferences: ^2.2.0

  # PDF & Printing
  pdf: ^3.10.4
  printing: '>=5.13.0 <5.15.0'

  # Sharing & URLs
  share_plus: ^13.3.0
  url_launcher: ^6.2.0

  # UI
  flutter_svg: ^2.0.9

  # Localization
  intl: ^0.20.2

  # App information
  package_info_plus: ^10.2.1

  # Barcode scanning
  mobile_scanner: ^6.0.2

  # Secure storage — device ID, trial start, license key
  flutter_secure_storage: ^11.2.0

  # Cryptography — backup encryption (AES-256-GCM + PBKDF2)
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.4
  unorm_dart: ^0.3.3

  # Elmahdi Pay — subscription & license SDK
  elmahdi_pay_flutter:
    path: packages/elmahdi_pay_flutter
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.2.0
  in_app_update: ^4.2.5

dependency_overrides:
  # path_provider_android 2.3.x introduced a JNI/NDK-28 dependency that
  # conflicts with the NDK-29-only Termux Android SDK. Pin to 2.2.x.
  path_provider_android: '>=2.2.0 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

  # Test-only: runs database tests against a real SQLite on the host.
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#315C52"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
